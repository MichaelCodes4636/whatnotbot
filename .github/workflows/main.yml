name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'whatnot-android/**'
      - '.github/workflows/main.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'whatnot-android/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./whatnot-android

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # The repo is missing gradle/wrapper/gradle-wrapper.jar, so ./gradlew can't run.
    # Install Gradle directly instead (same version as gradle-wrapper.properties).
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.0'

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Build Release APK
      run: gradle assembleRelease --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: whatnot-android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-unsigned
        path: whatnot-android/app/build/outputs/apk/release/app-release-unsigned.apk
